[package]
name = "supersearch-cli"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "supersearch"
path = "src/main.rs"

[dependencies]
supersearch-config = { path = "../supersearch-config" }
supersearch-core = { path = "../supersearch-core" }
supersearch-index = { path = "../supersearch-index" }
supersearch-query = { path = "../supersearch-query" }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
csv = "1.4.0"
ctrlc = "3.5.2"
arboard = "3.7.0"
